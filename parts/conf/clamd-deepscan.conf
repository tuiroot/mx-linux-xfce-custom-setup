# ------------------------------------------------------------
# Socket und Berechtigungen
# ------------------------------------------------------------

LocalSocket /var/run/clamav/clamd.ctl
FixStaleSocket true
LocalSocketGroup clamav
LocalSocketMode 660
User clamav


# ------------------------------------------------------------
# Datenbanken
# ------------------------------------------------------------

DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly false
ConcurrentDatabaseReload false
SelfCheck 3600


# ------------------------------------------------------------
# Parallelität und Warteschlangen
# ------------------------------------------------------------

MaxThreads 4
MaxConnectionQueueLength 30
MaxQueue 32

ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 200
IdleTimeout 30


# ------------------------------------------------------------
# Verzeichnisverhalten
# ------------------------------------------------------------

MaxDirectoryRecursion 30
FollowDirectorySymlinks false
FollowFileSymlinks false
CrossFilesystems false


# ------------------------------------------------------------
# Dateitypen und Parser
# ------------------------------------------------------------

ScanMail true
ScanArchive true
ScanPE true
ScanELF true
ScanOLE2 true
ScanPDF true
ScanHTML true
ScanSWF true
ScanXMLDOCS true
ScanHWP3 true
ScanOneNote true
ScanImage true
ScanImageFuzzyHash true

HeuristicAlerts true

PhishingSignatures true
PhishingScanURLs true

DetectPUA true
ScanPartialMessages false
StructuredDataDetection false


# ------------------------------------------------------------
# Heuristische Warnungen
# ------------------------------------------------------------

HeuristicScanPrecedence false

AlertBrokenExecutables true
AlertBrokenMedia true

AlertEncryptedArchive true
AlertEncryptedDoc true
AlertOLE2Macros true

AlertPhishingSSLMismatch true
AlertPhishingCloak true
AlertPartitionIntersection true

AlertExceedsMax true


# ------------------------------------------------------------
# Scanverhalten
# ------------------------------------------------------------

AllowAllMatchScan true

DisableCache false
ForceToDisk false
DisableCertCheck false

ExitOnOOM true
LeaveTemporaryFiles false


# ------------------------------------------------------------
# Hauptlimits für Dateien
# ------------------------------------------------------------

MaxScanTime 300000

MaxScanSize 1024M
MaxFileSize 256M
StreamMaxLength 256M

MaxRecursion 30
MaxFiles 50000


# ------------------------------------------------------------
# Aufwendige Spezialanalysen
# ------------------------------------------------------------

MaxEmbeddedPE 256M

MaxHTMLNormalize 256M
MaxHTMLNoTags 256M
MaxScriptNormalize 256M
MaxZipTypeRcg 256M

MaxPartitions 128
MaxIconsPE 256
MaxRecHWP3 32


# ------------------------------------------------------------
# Reguläre Ausdrücke
# ------------------------------------------------------------

PCREMaxFileSize 256M
PCREMatchLimit 250000
PCRERecMatchLimit 5000


# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

LogFile /var/log/clamav/clamav_deep-scan.log
LogTime true
LogClean false
LogVerbose false
ExtendedDetectionInfo true

LogFileUnlock false
LogFileMaxSize 50M
LogRotate true
LogSyslog false

Foreground false
Debug false


# ------------------------------------------------------------
# Bytecode-Signaturen
# ------------------------------------------------------------

Bytecode true
BytecodeSecurity TrustSigned
BytecodeTimeout 30000


# ------------------------------------------------------------
# On-Access-Scan
# ------------------------------------------------------------

OnAccessMaxFileSize 64M
