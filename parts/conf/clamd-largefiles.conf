# ------------------------------------------------------------
# Socket und Berechtigungen
# ------------------------------------------------------------

LocalSocket /var/run/clamav/clamd.ctl
FixStaleSocket true
LocalSocketGroup clamav
LocalSocketMode 660

User clamav


# ------------------------------------------------------------
# Datenbanken
# ------------------------------------------------------------

DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly false

# Verhindert, dass während eines Datenbank-Reloads zeitweise
# zwei vollständige Scan-Engines im RAM liegen.
ConcurrentDatabaseReload false

SelfCheck 3600


# ------------------------------------------------------------
# Parallelität und Warteschlangen
# ------------------------------------------------------------

MaxThreads 4
MaxConnectionQueueLength 30
MaxQueue 32
ReadTimeout 180
CommandReadTimeout 5
SendBufTimeout 200
IdleTimeout 30


# ------------------------------------------------------------
# Verzeichnisverhalten
# ------------------------------------------------------------

MaxDirectoryRecursion 15
FollowDirectorySymlinks false
FollowFileSymlinks false

# Verhindert, dass ein Scan von / oder /home automatisch auf
# externe Laufwerke, Netzlaufwerke und andere Mounts übergreift.
CrossFilesystems false


# ------------------------------------------------------------
# Dateitypen und Parser
# ------------------------------------------------------------

ScanMail true
ScanArchive true
ScanPE true
ScanELF true
ScanOLE2 true
ScanPDF true
ScanHTML true
ScanSWF true
ScanXMLDOCS true
ScanHWP3 true

# Aktuelle Bezeichnung für AlgorithmicDetection.
HeuristicAlerts true

PhishingSignatures true
PhishingScanURLs true

DetectPUA false
ScanPartialMessages false
HeuristicScanPrecedence false
StructuredDataDetection false


# ------------------------------------------------------------
# Heuristische Warnungen
# ------------------------------------------------------------

# Verschlüsselte Dateien werden nicht pauschal als Schadsoftware
# gemeldet.
AlertEncryptedArchive false
AlertEncryptedDoc false

AlertOLE2Macros false
AlertPhishingSSLMismatch false
AlertPhishingCloak false
AlertPartitionIntersection false

#Dateien, die wegen eines Limits nicht vollständig
# gescannt wurden, werden sichtbar als Limits.Exceeded gemeldet.
AlertExceedsMax true


# ------------------------------------------------------------
# Scanverhalten
# ------------------------------------------------------------

AllowAllMatchScan false

ForceToDisk false
DisableCertCheck false
DisableCache false
ExitOnOOM false
LeaveTemporaryFiles false


# ------------------------------------------------------------
# Hauptlimits für große Dateien
# ------------------------------------------------------------

# Dieses Limit betrifft in aktuellen Versionen hauptsächlich ZIP.
MaxScanTime 180000

# Knapp unter der technischen 2-GiB-Grenze von ClamAV.
MaxScanSize 2047M
MaxFileSize 2047M
StreamMaxLength 2047M

MaxRecursion 16
MaxFiles 10000


# ------------------------------------------------------------
# Aufwendige Spezialanalysen
# ------------------------------------------------------------

# Eine vollständige Embedded-PE-Suche in jeder 2-GiB-Datei wäre
# für einen Desktop unverhältnismäßig teuer. Der gesamte Inhalt
# wird trotzdem auf normale Signaturen geprüft.
MaxEmbeddedPE 256M

MaxHTMLNormalize 64M
MaxHTMLNoTags 16M
MaxScriptNormalize 32M
MaxZipTypeRcg 1M

MaxPartitions 50
MaxIconsPE 100
MaxRecHWP3 16


# ------------------------------------------------------------
# Reguläre Ausdrücke
# ------------------------------------------------------------

# Aktuelle ClamAV-Standardwerte. Das ursprüngliche Verhältnis
# 10000 / 5000 war ungewöhnlich und sehr restriktiv.
PCREMatchLimit 100000
PCRERecMatchLimit 2000

# Verhindert extrem aufwendige PCRE-Scans über komplette
# Multi-Gigabyte-Dateien.
PCREMaxFileSize 128M


# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

LogFile /var/log/clamav/clamav_L-files.log
LogTime true
LogClean false
LogVerbose false
ExtendedDetectionInfo true

LogSyslog false
LogRotate true
LogFileUnlock false

# 0 würde die Größenbegrenzung deaktivieren.
LogFileMaxSize 20M

Foreground false
Debug false


# ------------------------------------------------------------
# Bytecode-Signaturen
# ------------------------------------------------------------

Bytecode true
BytecodeSecurity TrustSigned

# Aktueller Standard statt unnötiger 60 Sekunden.
BytecodeTimeout 10000


# ------------------------------------------------------------
# On-Access-Scan
# ------------------------------------------------------------

# Große Videos sollten nicht beim Öffnen blockierend geprüft
# werden. Sie werden stattdessen bewusst per clamdscan geprüft.
OnAccessMaxFileSize 64M
